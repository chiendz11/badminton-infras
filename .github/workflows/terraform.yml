name: Terraform PR validation and plan
'on':
  pull_request:
    paths:
    - terraform/**
    - environments/**
    - scripts/**
    - contracts/**
    - .github/workflows/**
permissions:
  contents: read
  id-token: write
env:
  TF_IN_AUTOMATION: 'true'
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_state_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
  TF_VAR_project_name: badminton-prod
  TF_VAR_github_repository: chiendz11/badminton-infras
  TF_VAR_github_environment: production
  TF_VAR_existing_github_oidc_provider_arn: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
  TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
  TF_VAR_rabbitmq_credentials_secret_arn: ${{ vars.RABBITMQ_BOOTSTRAP_SECRET_ARN }}
  TF_VAR_redis_credentials_secret_arn: ${{ vars.REDIS_BOOTSTRAP_SECRET_ARN }}
  TF_VAR_zone_name: ${{ vars.DNS_ZONE_NAME }}
  TF_VAR_public_domain_name: ${{ vars.PUBLIC_DOMAIN_NAME }}
  TF_VAR_admin_domain_name: ${{ vars.ADMIN_DOMAIN_NAME }}
  TF_VAR_bootstrap_runtime_secret_arns: ${{ vars.BOOTSTRAP_RUNTIME_SECRET_ARNS }}
  TF_VAR_mongodb_allowed_cidrs: ${{ vars.MONGODB_ALLOWED_CIDRS || '[]' }}
jobs:
  terraform:
    name: terraform (${{ matrix.root }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
        - bootstrap
        - domain
        - platform
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.10.5
        terraform_wrapper: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install contract dependencies
      run: python -m pip install -r requirements.txt
    - name: Initialize bootstrap backend declaration
      if: matrix.root == 'bootstrap'
      run: cp terraform/bootstrap/backend.tf.example terraform/bootstrap/backend.tf
    - name: Format check
      run: terraform fmt -check -recursive terraform
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
    - name: Initialize remote state
      env:
        STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        STATE_REGION: ${{ vars.AWS_REGION }}
        STATE_KMS: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      run: terraform -chdir=terraform/${{ matrix.root }} init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$STATE_REGION"
        -backend-config="kms_key_id=$STATE_KMS"
    - name: Validate Terraform
      run: terraform -chdir=terraform/${{ matrix.root }} validate
    - uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: v0.55.1
    - name: Lint Terraform
      run: |-
        tflint --init
        tflint --chdir=terraform/${{ matrix.root }} --config="$GITHUB_WORKSPACE/.tflint.hcl"
    - name: Security scan
      uses: aquasecurity/trivy-action@v0.28.0
      with:
        scan-type: config
        scan-ref: terraform/${{ matrix.root }}
        exit-code: '1'
        severity: HIGH,CRITICAL
        trivyignores: .trivyignore
    - name: Speculative plan (never apply on PR)
      env:
        ROOT_NAME: ${{ matrix.root }}
      run: |
        set -euo pipefail
        if [ "$ROOT_NAME" = platform ]; then
          terraform -chdir=terraform/platform plan -input=false -var-file=../../environments/production.tfvars -var="enable_argocd_bootstrap=${{ vars.ENABLE_ARGOCD_BOOTSTRAP || 'false' }}" -var="enable_gitops_root=${{ vars.ENABLE_GITOPS_ROOT || 'false' }}"
        else
          terraform -chdir="terraform/$ROOT_NAME" plan -input=false
        fi
