global:
  domain: argocd.internal
configs:
  params:
    server.insecure: false
  cm:
    resource.customizations.health.argoproj.io_Application: "hs = {status = \"Progressing\"\
      , message = \"Waiting for child Application\"}\nif obj.status ~= nil and obj.status.health\
      \ ~= nil then\n  hs.status = obj.status.health.status\n  hs.message = obj.status.health.message\
      \ or \"\"\nend\nif obj.spec.syncPolicy == nil or obj.spec.syncPolicy.automated\
      \ == nil then\n  hs.status = \"Healthy\"\n  hs.message = \"Manual application:\
      \ waiting for verified platform/image release\"\nend\nreturn hs\n"
    resource.customizations.health.external-secrets.io_ExternalSecret: "hs = {status\
      \ = \"Progressing\", message = \"Waiting for secret synchronization\"}\nif obj.status\
      \ ~= nil and obj.status.conditions ~= nil then\n  for _, condition in ipairs(obj.status.conditions)\
      \ do\n    if condition.type == \"Ready\" and condition.status == \"True\" then\n\
      \      hs.status = \"Healthy\"\n      hs.message = condition.message or \"Secret\
      \ synchronized\"\n    end\n  end\nend\nreturn hs\n"
server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
controller:
  replicas: 1
  metrics:
    enabled: true
repoServer:
  replicas: 2
applicationSet:
  replicas: 2
extraObjects:
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: terraform-plan-helm-read
    namespace: argocd
  rules:
  - apiGroups:
    - ''
    resources:
    - secrets
    verbs:
    - get
    - list
    - watch
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: terraform-plan-helm-read
    namespace: argocd
  subjects:
  - kind: Group
    name: terraform-plan
    apiGroup: rbac.authorization.k8s.io
  roleRef:
    kind: Role
    name: terraform-plan-helm-read
    apiGroup: rbac.authorization.k8s.io
